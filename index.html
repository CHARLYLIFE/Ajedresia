<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedresia - Asistente IA</title>
    <!-- Estilos de Chessboard.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Tablero de Análisis Offline</h2>
        <div id="myBoard" style="width: 360px"></div>
        
        <div class="controls">
            <button id="resetBtn">Reiniciar</button>
            <button id="flipBtn">Girar</button>
            <button id="autoMoveBtn" style="background-color: #16a34a;">Jugar IA</button>
        </div>

        <div class="status-box">
            <p><strong>Estado:</strong> <span id="status">Turno (Blancas)</span></p>
            <p><strong>Sugerencia IA:</strong> <span id="bestMove" style="color: #4ade80; font-weight: bold;">Calculando...</span></p>
            <p><strong>FEN actual:</strong></p>
            <textarea id="fen" readonly></textarea>
        </div>
    </div>

    <!-- Librerías externas -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
