name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK de depuración
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Construir web y copiar Stockfish 19 Full
        run: npm run build

      - name: Crear el proyecto Android de Capacitor
        run: npx cap add android

      - name: Sincronizar recursos Android
        run: npx cap sync android

      - name: Asegurar SDK necesario
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ChessMax-3000-plus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
